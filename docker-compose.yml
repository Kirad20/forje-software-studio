# Forja en Docker Compose, lista para Coolify (build pack «Docker Compose").
#
# Coolify:   ver docs/despliegue-coolify.md. Coolify genera el dominio (SERVICE_URL_FORJA_4100),
#            la clave de cifrado (SERVICE_HEX_64_SECRETSKEY) y el token de instalación
#            (SERVICE_PASSWORD_BOOTSTRAP) y la contraseña de Postgres (SERVICE_PASSWORD_POSTGRES).
#            El resto de la configuración se edita en el studio (Administración).
# Local:     cp .env.example .env   (rellena SERVICE_HEX_64_SECRETSKEY y SERVICE_PASSWORD_POSTGRES)
#            docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# La plataforma guarda sus datos en postgres. app-runtime es el único propietario de las bases PGlite
# del volumen forja-data; forja accede a ellas por su API interna, nunca las abre directamente.

services:
  forja:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 0 quita Chromium (browser_test deja de estar disponible): imagen ~300 MB menor.
        BROWSER: ${FORJA_BROWSER:-1}
        # 0 quita Java/Maven/bubblewrap (backends Spring Boot): imagen ~350 MB menor.
        JAVA: ${FORJA_JAVA:-1}
    # Heap de V8 acotado por servicio (docs/memory.md). Va en el comando, no en NODE_OPTIONS, para
    # que npm, los sandboxes y demás procesos hijos no lo hereden.
    command: ["node", "--max-old-space-size=${FORJA_HEAP_MB:-1024}", "--import", "tsx", "server/bootstrap/server.ts"]
    restart: unless-stopped
    # bubblewrap aísla las compilaciones y JVM de los backends Java; el perfil seccomp por
    # defecto de Docker bloquea sus user namespaces (docs/language-runtimes.md).
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    expose:
      - "4100"
    environment:
      # --- Coolify: dominio, proxy y secretos generados ---
      # El dominio del studio: en Coolify, Domains del servicio forja = https://tu-dominio:4100 (el
      # sufijo :4100 dice al proxy a qué puerto del contenedor enrutar). El valor / declara esta
      # variable mágica a Coolify; al desplegar, Coolify lo reemplaza por la URL pública generada.
      - SERVICE_URL_FORJA_4100=/
      # URL pública del studio. Vacía: Forja usa SERVICE_URL_FORJA_4100 y, si Coolify no la define,
      # https://FORJA_DOMAIN. Rellénala solo si el studio vive en otra dirección.
      - PUBLIC_URL=${PUBLIC_URL:-}
      - FORJA_DOMAIN=${FORJA_DOMAIN:-}
      # 64 caracteres hex (32 bytes) generados una vez y guardados por Coolify. Cifra los secretos
      # de los proyectos: si se pierde o cambia, esos secretos dejan de poder leerse. Respáldala.
      - SECRETS_KEY=${SERVICE_HEX_64_SECRETSKEY}
      # Token de un solo uso para crear la primera cuenta de administrador (también sale en el log).
      - FORJA_BOOTSTRAP_TOKEN=${SERVICE_PASSWORD_BOOTSTRAP}
      # Traefik (el proxy de Coolify) está delante: la IP del cliente sale de X-Forwarded-For.
      - FORJA_TRUST_PROXY=${FORJA_TRUST_PROXY:-1}
      - PORT=4100
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - APP_DATA_SERVICE_URL=http://app-runtime:4200
      - APP_DATA_SERVICE_TOKEN=${SERVICE_PASSWORD_APP_DATA:-${SERVICE_PASSWORD_BUILDER:?Set SERVICE_PASSWORD_BUILDER}}
      - APP_RUNTIME_INTERNAL_URL=http://app-runtime:4200
      - BUILDER_SERVICE_URL=http://builder:4300
      - BUILDER_SERVICE_TOKEN=${SERVICE_PASSWORD_BUILDER:?Set SERVICE_PASSWORD_BUILDER}
      - JOB_WORKER_INTERNAL_URL=http://job-worker:4400
      - APP_RUNTIME_PUBLIC_PORT=${APP_RUNTIME_PUBLIC_PORT:-}
      - FORJA_JOB_WORKER_MODE=external
      - FORJA_JOB_MAX_ATTEMPTS=${FORJA_JOB_MAX_ATTEMPTS:-3}
      - FORJA_JOB_QUEUE_LIMIT=${FORJA_JOB_QUEUE_LIMIT:-1000}

      # Base de datos de la plataforma (servicio postgres de abajo).
      # Si Coolify no genera SERVICE_PASSWORD_POSTGRES se usa un valor fijo: Postgres no publica puerto y
      # solo se alcanza desde la red interna de este compose. Defínela antes del primer arranque si
      # quieres una propia: Postgres guarda la contraseña con la que se inicializó su volumen.
      - DATABASE_URL=postgres://forja:${SERVICE_PASSWORD_POSTGRES:-forja-internal-db}@postgres:5432/forja
      # El resto de la configuración (registro, créditos, modelos y proveedores, SMTP, GitHub,
      # Langfuse, evals, npm…) ya no va aquí: se edita en el studio, Administración → General.
    depends_on:
      postgres:
        condition: service_healthy
      app-runtime:
        condition: service_healthy
      builder:
        condition: service_healthy
    volumes:
      # Bases de datos de las apps (PGlite), archivos subidos y versiones publicadas. Respáldalo junto a forja-pg.
      - forja-data:/app/data
      # Caché de paquetes npm de las apps: se reconstruye sola, solo evita reinstalar tras cada despliegue.
      - forja-deps:/app/node_modules/.forja-deps
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Deja que PGlite cierre limpio (SIGTERM → closeAll) antes de matar el proceso.
    stop_grace_period: 30s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=forja
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:-forja-internal-db}
      - POSTGRES_DB=forja
    volumes:
      - forja-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forja -d forja"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-runtime:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BROWSER: ${FORJA_BROWSER:-1}
        # 0 quita Java/Maven/bubblewrap (backends Spring Boot): imagen ~350 MB menor.
        JAVA: ${FORJA_JAVA:-1}
    command: ["node", "--max-old-space-size=${FORJA_APP_RUNTIME_HEAP_MB:-1024}", "--import", "tsx", "server/bootstrap/appRuntimeServer.ts"]
    restart: unless-stopped
    # bubblewrap aísla las compilaciones y JVM de los backends Java; el perfil seccomp por
    # defecto de Docker bloquea sus user namespaces (docs/language-runtimes.md).
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    expose:
      - "4200"
    environment:
      - PORT=4200
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - PUBLIC_URL=${PUBLIC_URL:-}
      - FORJA_DOMAIN=${FORJA_DOMAIN:-}
      - FORJA_TRUST_PROXY=${FORJA_TRUST_PROXY:-1}
      - SECRETS_KEY=${SERVICE_HEX_64_SECRETSKEY}
      - DATABASE_URL=postgres://forja:${SERVICE_PASSWORD_POSTGRES:-forja-internal-db}@postgres:5432/forja
      - APP_RUNTIME_PUBLIC_PORT=${APP_RUNTIME_PUBLIC_PORT:-}
      - APP_DATA_SERVICE_TOKEN=${SERVICE_PASSWORD_APP_DATA:-${SERVICE_PASSWORD_BUILDER:?Set SERVICE_PASSWORD_BUILDER}}
      # Límites de memoria de lo que este servicio aloja (docs/memory.md): bases PGlite abiertas y su
      # buffer pool, procesos sandbox de endpoints y JVM de los backends Java.
      - FORJA_DB_MAX_OPEN=${FORJA_DB_MAX_OPEN:-16}
      - FORJA_DB_SHARED_BUFFERS=${FORJA_DB_SHARED_BUFFERS:-16MB}
      - FORJA_SANDBOX_MAX_PROCESSES=${FORJA_SANDBOX_MAX_PROCESSES:-16}
      - FORJA_SANDBOX_MAX_HEAP_MB=${FORJA_SANDBOX_MAX_HEAP_MB:-512}
      - FORJA_JAVA_MAX_HEAP_MB=${FORJA_JAVA_MAX_HEAP_MB:-256}
      - FORJA_LANG_MAX_PROCESSES=${FORJA_LANG_MAX_PROCESSES:-4}
    volumes:
      # Este es el único proceso que abre/escribe las bases PGlite de los proyectos.
      - forja-data:/app/data
      - forja-deps:/app/node_modules/.forja-deps
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    labels:
      # Las apps tienen otro runtime y proceso de datos que el studio/API.
      - traefik.enable=true
      - traefik.http.routers.forja-apps.rule=HostRegexp(`^[a-z0-9-]+\.${FORJA_DOMAIN:-forja.localhost}$$`)
      - traefik.http.routers.forja-apps.entrypoints=https
      - traefik.http.routers.forja-apps.tls=true
      - traefik.http.routers.forja-apps.priority=100
      - traefik.http.routers.forja-apps.service=forja-apps
      - traefik.http.routers.forja-apps-http.rule=HostRegexp(`^[a-z0-9-]+\.${FORJA_DOMAIN:-forja.localhost}$$`)
      - traefik.http.routers.forja-apps-http.entrypoints=http
      - traefik.http.routers.forja-apps-http.priority=100
      - traefik.http.routers.forja-apps-http.middlewares=forja-apps-https
      - traefik.http.routers.forja-apps-http.service=forja-apps
      - traefik.http.middlewares.forja-apps-https.redirectscheme.scheme=https
      - traefik.http.services.forja-apps.loadbalancer.server.port=4200

  job-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BROWSER: ${FORJA_BROWSER:-1}
        # 0 quita Java/Maven/bubblewrap (backends Spring Boot): imagen ~350 MB menor.
        JAVA: ${FORJA_JAVA:-1}
    command: ["node", "--max-old-space-size=${FORJA_JOB_WORKER_HEAP_MB:-512}", "--import", "tsx", "server/bootstrap/jobWorkerServer.ts"]
    restart: unless-stopped
    expose:
      - "4400"
    environment:
      - PORT=4400
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - PUBLIC_URL=${PUBLIC_URL:-}
      - FORJA_DOMAIN=${FORJA_DOMAIN:-}
      - SECRETS_KEY=${SERVICE_HEX_64_SECRETSKEY}
      - DATABASE_URL=postgres://forja:${SERVICE_PASSWORD_POSTGRES:-forja-internal-db}@postgres:5432/forja
      - APP_DATA_SERVICE_URL=http://app-runtime:4200
      - APP_DATA_SERVICE_TOKEN=${SERVICE_PASSWORD_APP_DATA:-${SERVICE_PASSWORD_BUILDER:?Set SERVICE_PASSWORD_BUILDER}}
      - APP_RUNTIME_INTERNAL_URL=http://app-runtime:4200
      - APP_RUNTIME_PUBLIC_PORT=${APP_RUNTIME_PUBLIC_PORT:-}
      - FORJA_JOB_WORKER_MODE=external
      - FORJA_JOB_WORKER_SERVICES=${FORJA_JOB_WORKER_SERVICES:-}
      - FORJA_JOB_WORKER_PROJECT_ID=${FORJA_JOB_WORKER_PROJECT_ID:-}
      - FORJA_JOB_CONCURRENCY=${FORJA_JOB_CONCURRENCY:-4}
      - FORJA_JOB_POLL_MS=${FORJA_JOB_POLL_MS:-1000}
      - FORJA_JOB_LEASE_MS=${FORJA_JOB_LEASE_MS:-60000}
      - FORJA_JOB_MAX_ATTEMPTS=${FORJA_JOB_MAX_ATTEMPTS:-3}
      - FORJA_JOB_QUEUE_LIMIT=${FORJA_JOB_QUEUE_LIMIT:-1000}
      # Los jobs corren en procesos sandbox de este servicio (docs/memory.md).
      - FORJA_SANDBOX_MAX_PROCESSES=${FORJA_SANDBOX_MAX_PROCESSES:-16}
      - FORJA_SANDBOX_MAX_HEAP_MB=${FORJA_SANDBOX_MAX_HEAP_MB:-512}
    volumes:
      # Compiled source and dependencies only; project DB access is always remote.
      - forja-data:/app/data
      - forja-deps:/app/node_modules/.forja-deps
    depends_on:
      postgres:
        condition: service_healthy
      app-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 120s

  builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BROWSER: ${FORJA_BROWSER:-1}
        # 0 quita Java/Maven/bubblewrap (backends Spring Boot): imagen ~350 MB menor.
        JAVA: ${FORJA_JAVA:-1}
    command: ["node", "--max-old-space-size=${FORJA_BUILDER_HEAP_MB:-1536}", "--import", "tsx", "server/bootstrap/builderServer.ts"]
    restart: unless-stopped
    # bubblewrap aísla las compilaciones y JVM de los backends Java; el perfil seccomp por
    # defecto de Docker bloquea sus user namespaces (docs/language-runtimes.md).
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    expose:
      - "4300"
    environment:
      - PORT=4300
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - SECRETS_KEY=${SERVICE_HEX_64_SECRETSKEY}
      - DATABASE_URL=postgres://forja:${SERVICE_PASSWORD_POSTGRES:-forja-internal-db}@postgres:5432/forja
      - APP_DATA_SERVICE_URL=http://app-runtime:4200
      - APP_DATA_SERVICE_TOKEN=${SERVICE_PASSWORD_APP_DATA:-${SERVICE_PASSWORD_BUILDER:?Set SERVICE_PASSWORD_BUILDER}}
      - APP_RUNTIME_INTERNAL_URL=http://app-runtime:4200
      - APP_RUNTIME_PUBLIC_PORT=${APP_RUNTIME_PUBLIC_PORT:-}
      - BUILDER_SERVICE_TOKEN=${SERVICE_PASSWORD_BUILDER:?Set SERVICE_PASSWORD_BUILDER}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - FORJA_DOMAIN=${FORJA_DOMAIN:-}
      - FORJA_TRUST_PROXY=${FORJA_TRUST_PROXY:-1}
    volumes:
      - forja-data:/app/data
      - forja-deps:/app/node_modules/.forja-deps
    depends_on:
      postgres:
        condition: service_healthy
      app-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

volumes:
  forja-pg:
  forja-data:
  forja-deps:
