# Uso local, sin Coolify ni Traefik delante:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# Studio en http://localhost:4100; apps publicadas en http://<slug>.localhost:4100.
services:
  forja:
    ports:
      - "${FORJA_PORT:-4100}:4100"
    environment:
      # Sin proxy delante: X-Forwarded-For lo manda el cliente y no es de fiar.
      - FORJA_TRUST_PROXY=0
      - APP_RUNTIME_PUBLIC_PORT=4200
  app-runtime:
    ports:
      - "${APP_RUNTIME_PORT:-4200}:4200"
    environment:
      - FORJA_TRUST_PROXY=0
      - APP_RUNTIME_PUBLIC_PORT=4200
  builder:
    environment:
      - APP_RUNTIME_PUBLIC_PORT=4200
  postgres:
    # Para conectarte desde fuera (psql, npm run dev con DATABASE_URL a localhost:5432).
    ports:
      - "${FORJA_PG_PORT:-5432}:5432"
