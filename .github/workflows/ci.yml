name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
      # Each test creates and drops its own database on this server (test/helpers/pg.mjs).
      TEST_DATABASE_URL: postgres://forja:forja@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forja
          POSTGRES_PASSWORD: forja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forja" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # Unit integration, e2e and agent tests drive Chromium against the built Studio.
      - uses: actions/cache@v4
        with:
          path: .ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm test
      - run: npm run test:pwa
      - run: npm run test:e2e
      - run: npm run test:agents
      - run: npm run test:github
      - run: npm run test:studio

  # The deployable image still builds and boots.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: forja:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arrancar y comprobar /healthz
        run: |
          docker network create forja
          docker run -d --name pg --network forja -e POSTGRES_USER=forja -e POSTGRES_PASSWORD=forja -e POSTGRES_DB=forja postgres:17-alpine
          until docker exec pg pg_isready -U forja; do sleep 1; done
          docker run -d --name forja --network forja -p 4100:4100 -e SECRETS_KEY=$(openssl rand -hex 32) -e DATABASE_URL=postgres://forja:forja@pg:5432/forja forja:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4100/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:4100/healthz
          docker exec forja node -e "import('playwright-core').then(async ({ chromium }) => { const b = await chromium.launch(); await b.close(); console.log('chromium ok'); })"
      - if: failure()
        run: docker logs forja
