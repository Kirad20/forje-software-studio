name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # browser_test drives a real headless Chromium in the e2e and agent tests.
      - uses: actions/cache@v4
        with:
          path: .ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run test:e2e
      - run: npm run test:agents

  # The deployable image still builds and boots.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: forja:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Arrancar y comprobar /healthz
        run: |
          docker run -d --name forja -p 4100:4100 -e SECRETS_KEY=$(openssl rand -hex 32) forja:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4100/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:4100/healthz
          docker exec forja node -e "import('playwright-core').then(async ({ chromium }) => { const b = await chromium.launch(); await b.close(); console.log('chromium ok'); })"
      - if: failure()
        run: docker logs forja
