<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6758e8" />
    <title>Sin conexión — Forja</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: light-dark(#f7f8fc, #111111); color: light-dark(#20212b, #ededed); }
      main { max-width: 420px; padding: 32px; text-align: center; }
      img { width: 80px; height: 80px; }
      p { line-height: 1.6; }
      a { display: inline-block; padding: 12px 24px; border-radius: 10px; background: #6758e8; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Estás sin conexión</h1>
      <p>Forja necesita conexión para acceder a tus proyectos y ejecutar el constructor. Los datos de tu cuenta no se guardan en la caché offline.</p>
      <p>Si tenías cambios sin guardar en otra pestaña, mantenla abierta hasta recuperar la conexión.</p>
      <a href="">Reintentar conexión</a>
    </main>
  </body>
</html>
